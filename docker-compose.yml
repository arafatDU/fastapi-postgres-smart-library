services:
  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    container_name: nginx-gateway
    ports:
      - "80:80"
    depends_on:
      - user-service
      - book-service
      - loan-service

  # User Service and Database
  user-db:
    image: postgres:14-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/user_db
    expose:
      - "8081"
    depends_on:
      user-db:
        condition: service_healthy

  # Book Service and Database
  book-db:
    image: postgres:14-alpine
    container_name: book-db
    environment:
      POSTGRES_DB: book_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - book-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  book-service:
    build: ./book-service
    container_name: book-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@book-db:5432/book_db
    expose:
      - "8082"
    depends_on:
      book-db:
        condition: service_healthy

  # Loan Service and Database
  loan-db:
    image: postgres:14-alpine
    container_name: loan-db
    environment:
      POSTGRES_DB: loan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - loan-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  loan-service:
    build: ./loan-service
    container_name: loan-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@loan-db:5432/loan_db
      USER_SERVICE_URL: http://user-service:8081
      BOOK_SERVICE_URL: http://book-service:8082
    expose:
      - "8083"
    depends_on:
      loan-db:
        condition: service_healthy
      user-service:
        condition: service_started
      book-service:
        condition: service_started

volumes:
  user-db-data:
  book-db-data:
  loan-db-data:
